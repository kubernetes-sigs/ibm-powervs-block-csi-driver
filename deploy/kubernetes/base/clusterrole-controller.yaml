---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: powervs-csi-controller-role
  labels:
    app.kubernetes.io/name: ibm-powervs-block-csi-driver
rules:
  # Required by controller-runtime metrics FilterProvider (WithAuthenticationAndAuthorization)
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: powervs-csi-controller-rolebinding
  labels:
    app.kubernetes.io/name: ibm-powervs-block-csi-driver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: powervs-csi-controller-role
subjects:
  - kind: ServiceAccount
    name: powervs-csi-controller-sa
    namespace: kube-system
