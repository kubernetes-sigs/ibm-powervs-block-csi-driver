---
# NetworkPolicy for the powervs-csi-node DaemonSet.
#
# Default-deny all ingress, then allow:
#   - kubelet liveness probe → :9808 (powervs-plugin healthz)
#
# All CSI communication (gRPC) uses a UNIX domain socket and is not
# network-accessible. All egress is unrestricted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: powervs-csi-node
  namespace: kube-system
  labels:
    app.kubernetes.io/name: ibm-powervs-block-csi-driver
spec:
  podSelector:
    matchLabels:
      app: powervs-csi-node
      app.kubernetes.io/name: ibm-powervs-block-csi-driver
  policyTypes:
    - Ingress
  ingress:
    # Kubelet liveness probes originate from the host network and are not
    # representable by a podSelector; allow the port from any source and
    # rely on the port restriction to limit exposure.
    - ports:
        - protocol: TCP
          port: 9808   # powervs-plugin healthz
