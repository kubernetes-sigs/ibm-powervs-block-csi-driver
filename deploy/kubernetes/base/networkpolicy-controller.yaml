---
# NetworkPolicy for the powervs-csi-controller Deployment.
#
# Default-deny all ingress, then allow:
#   - kubelet liveness probe → :9808 (powervs-plugin healthz)
#   - kubelet liveness probe → :8082 (node-update-controller healthz)
#   - Prometheus scraping    → :8081 (node-update-controller metrics)
#
# Port 9443 (webhook) is not exposed externally in the base deployment;
# add an overlay rule if a MutatingWebhookConfiguration is wired up.
#
# All egress is unrestricted (controller must reach the IBM Cloud API and
# the Kubernetes API server).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: powervs-csi-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: ibm-powervs-block-csi-driver
spec:
  podSelector:
    matchLabels:
      app: powervs-csi-controller
      app.kubernetes.io/name: ibm-powervs-block-csi-driver
  policyTypes:
    - Ingress
  ingress:
    # Kubelet liveness probes originate from the host network and are not
    # representable by a podSelector; allow the port from any source and
    # rely on the port restriction to limit exposure.
    - ports:
        - protocol: TCP
          port: 9808   # powervs-plugin healthz
    - ports:
        - protocol: TCP
          port: 8082   # node-update-controller health probe
    # Prometheus scraping — restrict to the monitoring namespace if your
    # cluster uses a labelled namespace (e.g. add a namespaceSelector here).
    - ports:
        - protocol: TCP
          port: 8081   # node-update-controller metrics
