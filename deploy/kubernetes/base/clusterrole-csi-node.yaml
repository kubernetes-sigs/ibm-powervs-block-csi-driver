---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: powervs-node-role
  labels:
    app.kubernetes.io/name: ibm-powervs-block-csi-driver
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    # "patch" is the minimum RBAC verb for writing node fields; the driver
    # only writes spec.providerID and only when it is unset.
    verbs: ["get", "patch"]
